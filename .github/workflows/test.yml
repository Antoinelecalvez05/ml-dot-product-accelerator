name: Verify RTL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator and synthesis tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify, synthesize and compare
        run: make all PYTHON=python
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            reports/
            build/sim/**/results.xml
            build/sim/**/*.log
